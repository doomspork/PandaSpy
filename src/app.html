<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			`lang` is set to the negotiated locale at runtime by src/lib/i18n.ts.
			It cannot be templated here: this is a static SPA with no server
			render, so the document is produced before the locale is known.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
