# ─── PandaSpy workspace ─────────────────────────────────────────────────────────
#
# NOTE: this manifest is BOTH the workspace root AND a package (`xtask`).
# That is deliberate and load-bearing. Release Please's `rust` strategy refuses
# to update a virtual manifest ("is not a package manifest"), so the root must
# declare a `[package]`. Rather than invent a dummy crate we let the root be the
# repo's dev-task runner. See CLAUDE.md § Releases before changing this.

[package]
name          = "xtask"
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.94"
license       = "MIT"
publish       = false
description   = "Repository automation for PandaSpy (locale parity, cfg-leak checks)."

# Explicit targets: the workspace root directory contains the frontend `src/`,
# so Cargo's auto-discovery must not go looking for `src/main.rs` there.
autobins      = false
autoexamples  = false
autotests     = false
autobenches   = false
autolib       = false

[lib]
name = "xtask"
path = "xtask/src/lib.rs"

[[bin]]
name = "xtask"
path = "xtask/src/main.rs"

[dependencies]
anyhow        = { workspace = true }
fluent-syntax = { workspace = true }
regex         = { workspace = true }
toml          = { workspace = true }
walkdir       = { workspace = true }

[lints]
workspace = true

# ─── Workspace ───────────────────────────────────────────────────────────────

[workspace]
resolver = "3"

# Listed one-by-one on purpose. Release Please reads `workspace.members`
# verbatim and cannot expand a `crates/*` glob — a globbed member is silently
# skipped and its version drifts out of lockstep. Adding a crate means adding a
# line here.
members = [
  "crates/pandaspy-proto",
  "crates/pandaspy-discovery",
  "crates/pandaspy-client",
  "crates/pandaspy-store",
  "src-tauri",
]

# The root package (`xtask`) is a member implicitly. Without `default-members`,
# a bare `cargo test` at a root-that-is-also-a-package would test ONLY the root
# package and silently skip every crate.
default-members = [
  ".",
  "crates/pandaspy-proto",
  "crates/pandaspy-discovery",
  "crates/pandaspy-client",
  "crates/pandaspy-store",
  "src-tauri",
]

[workspace.package]
edition      = "2024"
rust-version = "1.94"
license      = "MIT"
authors      = ["Sean Callan <seancallan@gmail.com>"]

# NOTE: `version` is deliberately absent from `[workspace.package]`. Every crate
# declares a literal `version = "x.y.z"`; Release Please rewrites all of them in
# one commit. `version.workspace = true` would defeat that rewriter.

[workspace.dependencies]
# Internal crates: path-only, NO version. They are never published, and a
# version pin here would be invisible to Release Please's updater and go stale.
pandaspy-client    = { path = "crates/pandaspy-client" }
pandaspy-discovery = { path = "crates/pandaspy-discovery" }
pandaspy-proto     = { path = "crates/pandaspy-proto" }
pandaspy-store     = { path = "crates/pandaspy-store" }

# Third-party
anyhow           = "1.0.104"
fluent-bundle    = "0.16.0"
fluent-syntax    = "0.12.0"
if-addrs         = "0.15.0"
include_dir      = "0.7.4"
insta            = { version = "1.48.0", features = ["json"] }
log              = "0.4.33"
rcgen            = "0.14.8"
regex            = "1.13.1"
# rustls with the ring provider, NOT the aws-lc-rs default: ring builds
# cleanly on all four release targets, and one crypto stack everywhere is the
# whole point. `deny.toml` bans openssl-sys and native-tls outright.
rustls           = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde            = { version = "1.0.229", features = ["derive"] }
serde_json       = "1.0.151"
socket2          = "0.6.5"
thiserror        = "2.0.19"
tokio            = { version = "1.53.1", default-features = false }
tokio-rustls     = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
toml             = "1.1.4"
unic-langid      = { version = "0.9.6", features = ["macros"] }
walkdir          = "2.5.0"
x509-parser      = "0.18.1"

[workspace.lints.rust]
unsafe_code                   = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ─── Profiles ────────────────────────────────────────────────────────────────
# PandaSpy is a tray app that sits idle in the menu bar all day. Optimise the
# shipped binary for size, not for compile time.

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
# NB: no `panic = "abort"`. It would shave a little size, but PandaSpy runs
# unattended for days; a panic in one printer's session task must not take the
# whole tray down with it.
