[package]
name         = "pandaspy"
version      = "0.1.0"
description  = "Monitor Bambu Lab 3D printers from the menu bar."
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
publish      = false

# ─── This crate is the platform layer, and stays THIN ────────────────────────
#
# What belongs here: Tauri commands, the tray, the window, the event bridge
# between Rust and the frontend, and the concrete implementations of the traits
# the domain crates define (real sockets, real keychains).
#
# What does not: anything a test would want to run without a GUI. If you are
# writing protocol logic, discovery logic or a state machine in here, it is in
# the wrong crate.
#
# This is one of exactly TWO places `#[cfg(target_os)]` is permitted; the other
# is `crates/pandaspy-store`. See CLAUDE.md § The one architectural rule.
#
# NOTE: the app version lives HERE and only here. `tauri.conf.json` has no
# `version` key and inherits this one; the root `package.json` has none either.

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
pandaspy-store = { workspace = true }

# TODO(scaffold): pandaspy-proto, pandaspy-discovery and pandaspy-client get added in the
# commits that first wire them in, so `cargo deny` reviews their dependency
# trees in the context of the change that needs them.

fluent-bundle = { workspace = true }
include_dir   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sys-locale    = "0.3.2"
tauri         = { version = "2.11.5", features = ["tray-icon"] }

# Platform-shell plugins. All desktop-only; none pulls a domain crate in.
#   single-instance  a second launch focuses the running window, not a duplicate
#   positioner       anchors the popover to the tray icon (needs `tray-icon` to
#                    expose the Tray* positions and the `on_tray_event` hook)
#   autostart        launch-at-login, toggled from settings, DEFAULT OFF
#   notification     OS notifications; raised from Rust in a later milestone
tauri-plugin-autostart       = "2.5.1"
tauri-plugin-notification    = "2.3.3"
tauri-plugin-positioner      = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"

unic-langid   = { workspace = true }

[lints]
workspace = true
