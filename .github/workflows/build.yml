name: Build

# Reusable. Two callers:
#   ci.yml       on pushes to main, to prove the app still packages everywhere
#   release.yml  to ATTACH artifacts to a release that already exists
#
# Note the deliberate absence of a `permissions:` block. A reusable workflow
# that declares permissions cannot be called by a workflow with fewer, so
# leaving it off lets ci.yml call this with `contents: read` and release.yml
# call it with `contents: write`.

on:
  workflow_call:
    inputs:
      release-id:
        description: >
          Numeric id of an EXISTING GitHub release to attach bundles to. Leave
          empty to upload them as workflow artifacts instead. This workflow
          never creates a release — Release Please owns that.
        type: string
        default: ''
      ref:
        description: Git ref to build. Empty means the caller's ref.
        type: string
        default: ''
      updater-json:
        description: >
          Generate and upload latest.json for the auto-updater. Requires
          TAURI_SIGNING_PRIVATE_KEY AND bundle.createUpdaterArtifacts: true
          in tauri.conf.json (see the TODO(signing) comment on the bundle
          step below for why both must land together), so this stays off
          until signing is provisioned.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (blank = default branch)
        type: string
        required: false
        default: ''

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            runner: macos-14
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled on the arm64 runner: GitHub retired
          # macos-13 (the last free Intel image), so a `macos-13` job just
          # queues forever for a runner that no longer exists. macos-14's Xcode
          # SDK builds x86_64 fine, and the arm64 runner is faster and cheaper
          # than an Intel one. (`x86_64-apple-darwin` is installed by the setup
          # action from `target` below.)
          - label: macOS (Intel)
            runner: macos-14
            target: x86_64-apple-darwin
          - label: Windows (x86-64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # ubuntu-22.04 deliberately, NOT ubuntu-latest. The glibc a binary is
          # linked against becomes the minimum glibc its users need; building on
          # a newer Ubuntu would silently drop everyone on a stable distro.
          - label: Linux (x86-64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.target }}
          cache-key: bundle-${{ matrix.target }}

      # macOS Developer ID signing + notarisation. Exported into the job env
      # only when the secrets exist, rather than set unconditionally on the
      # bundle step: to tauri's bundler a present-but-empty APPLE_* variable is
      # not the same as an absent one (it means "sign/notarise with this"), so
      # a fork or a repo without the secrets must not see them at all. Without
      # them the bundle is ad-hoc signed and Gatekeeper refuses it on a fresh
      # download (right-click → Open). Provisioning steps: CLAUDE.md, "macOS
      # signing".
      - name: Configure macOS signing
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set; this macOS bundle will be unsigned and unnotarised."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Half a configuration is worse than none: signing without the
          # notary credentials yields a bundle Gatekeeper still rejects, and it
          # would look shipped. Fail instead.
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::APPLE_CERTIFICATE is set but ${name} is not."
              exit 1
            fi
          done
          # Heredoc form so a base64 value that wraps across lines survives.
          # Values written here stay masked in logs: they came from secrets.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            delim="EOF_$(uuidgen)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "${!name}" "$delim" >> "$GITHUB_ENV"
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Apple's notary service fails transiently (NSURLErrorDomain -1009 while
      # polling appstoreconnect.apple.com, with the runner's network fine), so
      # a signed macOS bundle gets one retry. tauri-action is a JS action and
      # cannot be wrapped in a retry action; a duplicated step gated on the
      # first one's outcome is the native pattern. Compile artifacts survive,
      # so the retry costs only bundle → sign → notarise → upload.
      - name: Build and bundle
        id: bundle
        continue-on-error: ${{ steps.apple.outputs.enabled == 'true' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ─── TODO(signing): provision these, then uncomment ───────────────
          # macOS signing is wired above ("Configure macOS signing"). Still
          # unprovisioned: Windows bundles are unsigned (SmartScreen will
          # warn), and the updater cannot sign, so `updater-json` must stay
          # false.
          #
          # Tauri updater signing. `tauri.conf.json`'s `plugins.updater.pubkey`
          # already holds a PLACEHOLDER key (format-valid, matched private half
          # deliberately discarded and never committed) so the config is valid
          # JSON and the plugin registers — replace it with the real public key
          # from `cargo tauri signer generate` in the SAME change that adds
          # these two secrets. Do the same for `bundle.createUpdaterArtifacts`:
          # it is deliberately ABSENT from tauri.conf.json right now (its
          # default is `false`), not just false, because tauri-cli's bundler
          # (`sign_updaters` in `crates/tauri-cli/src/bundle.rs`) tries to sign
          # every updater-eligible bundle — Nsis, Deb, AppImage, the macOS
          # updater package — on EVERY `tauri build`, on every platform,
          # whenever it is truthy, regardless of `updater-json`/`uploadUpdaterJson`
          # below. Set it to `true` only once TAURI_SIGNING_PRIVATE_KEY is a
          # real secret here, or every bundle job (CI and local `pnpm tauri
          # build` alike) starts failing with "A public key has been found,
          # but no private key":
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          #
          # Windows code signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # ──────────────────────────────────────────────────────────────────
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          # Attach to the release Release Please already made. Empty means
          # "no release involved" and the bundles become workflow artifacts.
          releaseId: ${{ inputs.release-id }}
          uploadWorkflowArtifacts: ${{ inputs.release-id == '' }}
          # `[name]`/`[ext]` are tauri-action tokens it fills per bundle file.
          # Without them the pattern is used verbatim for EVERY bundle in a job
          # (.deb and .AppImage, .msi and the NSIS .exe, …), so the second
          # upload hits `upload-artifact@v4`'s no-duplicate-names rule and 409s.
          # `${{ matrix.target }}` keeps names unique across jobs; `[name][ext]`
          # keeps them unique within one.
          workflowArtifactNamePattern: pandaspy-${{ matrix.target }}-[name][ext]
          # Compared against `true` rather than passed through: tauri-action
          # reads this with `getBooleanInput`, which throws on an empty string —
          # and it *is* empty when this workflow is run via workflow_dispatch.
          uploadUpdaterJson: ${{ inputs.updater-json == true }}
          # Runners drop network connections often enough that a single
          # transient failure should not cost a whole release build.
          retryAttempts: 2

      - name: Build and bundle (retry after a notarisation failure)
        if: steps.bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep env and inputs in step with the first attempt; the reasons
          # for each input are commented there.
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ inputs.release-id }}
          uploadWorkflowArtifacts: ${{ inputs.release-id == '' }}
          workflowArtifactNamePattern: pandaspy-${{ matrix.target }}-[name][ext]
          uploadUpdaterJson: ${{ inputs.updater-json == true }}
          retryAttempts: 2

      # Belt and braces: prove the bundle Gatekeeper will actually see is
      # Developer ID signed, notarised and stapled, so a silently-unsigned
      # build can never be the one handed to beta testers.
      - name: Verify macOS signature and notarisation
        if: steps.apple.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/PandaSpy.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          for dmg in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            codesign --verify --verbose=2 "$dmg"
          done
