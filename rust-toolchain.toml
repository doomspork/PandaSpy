[toolchain]
# Pinned exactly so every developer machine and every CI runner agree.
# Bumping this is a `chore(deps):` commit of its own — see CLAUDE.md.
channel    = "1.94.0"
profile    = "minimal"
components = ["rustfmt", "clippy"]
# `pandaspy-proto` must stay free of I/O and platform APIs. The cheapest structural
# proof of that is that it compiles to wasm; CI runs
# `cargo check -p pandaspy-proto --target wasm32-unknown-unknown`.
targets    = ["wasm32-unknown-unknown"]
